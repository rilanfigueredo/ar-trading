<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net https://assets.coincap.io; connect-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ar_Trading</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">
  <header id="toolbar">
  <div class="tb-left">
    <img class="brand-logo" id="brandLogo" src="assets/logo-h-dark.png" alt="Ar_Trading">
    <span class="sep"></span>
    <button id="btnSymbol" class="tb-btn symbol" title="Cambiar activo (clic)">BTCUSDT</button>
    <span class="sep"></span>
    <div id="tfButtons" class="group" title="Temporalidad (atajos: [ y ])"></div>
    <span class="sep"></span>
    <div id="typeButtons" class="group">
      <button class="tb-btn" data-type="candles">Velas</button>
      <button class="tb-btn" data-type="line">Línea</button>
      <button class="tb-btn" data-type="area">Área</button>
    </div>
    <span class="sep"></span>
    <div id="scaleButtons" class="group">
      <button class="tb-btn" data-scale="normal" title="Escala normal">Normal</button>
      <button class="tb-btn" data-scale="log" title="Escala logarítmica">Log</button>
      <button class="tb-btn" data-scale="percent" title="Escala en porcentaje">%</button>
    </div>
    <button id="btnAuto" class="tb-btn" title="Volver al ajuste automático de la escala vertical (doble clic en la barra de precios también)">Auto</button>
    <span class="sep"></span>
    <button id="btnReplay" class="tb-btn" title="Reproducción de barras: elige una vela del pasado y mira cómo se formó el mercado vela a vela">Replay</button>
    <button id="btnData" class="tb-btn" title="Fuente de las velas: del exchange o armadas con operaciones reales (con filtro por tamaño)">Datos: Velas</button>
    <button id="btnLayout" class="tb-btn" title="Elegir cuántos gráficos ver (1 a 4)">Diseño: 1</button>
    <div id="syncGroup" class="group hidden">
      <button id="syncCross" class="tb-btn" title="Sincronizar la cruz entre gráficos">Cruz</button>
      <button id="syncTime" class="tb-btn" title="Sincronizar el tiempo entre gráficos">Tiempo</button>
    </div>
  </div>
  <div class="tb-right">
    <span id="status" class="status"></span>
    <button id="btnSettings" class="tb-btn">Ajustes</button>
  </div>
  </header>

  <main id="main">
    <aside id="drawBar" aria-label="Herramientas de dibujo"></aside>
    <div id="gridWrap">
      <div id="grid" class="layout-1"></div>
      <div id="favBar" class="hidden"></div>
      <div id="selBar" class="hidden"></div>
    </div>
    <aside id="panel" class="hidden"></aside>
    <aside id="objPanel" class="hidden"></aside>
    <aside id="watchPanel" class="hidden"></aside>
    <aside id="rightBar" aria-label="Indicadores, objetos y listas">
      <button id="btnIndicators" class="db-btn" title="Indicadores y medias (clic otra vez para cerrar)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 3 5-8 4 5"/><path d="M3 21h18"/></svg></button>
      <div id="rbObjects" class="rb-slot"></div>
      <button id="btnWatch" class="db-btn" title="Listas de seguimiento (clic otra vez para cerrar)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
    </aside>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script src="vendor/lightweight-charts.js"></script>
  <script src="js/lib.js"></script>
  <script src="js/api.js"></script>
  <script src="js/history.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/drawlayer.js"></script>
  <script src="js/view.js"></script>
  <script src="js/drawui.js"></script>
  <script src="js/watch.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
