# Publica el instalador de Windows cuando se sube una versión nueva (cambia "version" en package.json en la rama main) o al ejecutarlo a mano.
# Lo hace GitHub en un Windows real (así el icono y el instalador salen bien) y deja en «Releases»:
#   Ar_Trading-Instalador-X.Y.Z.exe + latest.yml (+ blockmap): con eso el programa instalado detecta y descarga la versión nueva solo.
# Si la versión ya está publicada (con su .exe), no hace nada.
name: Publicar versión
on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
  instalador:
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: ¿Ya está publicada esta versión?
        id: chk
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" --json assets --jq '[.assets[].name] | any(endswith(".exe"))' 2>/dev/null | grep -q true; then echo "existe=true" >> "$GITHUB_OUTPUT"; else echo "existe=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
        if: steps.chk.outputs.existe != 'true'
      - name: Crear y publicar el instalador
        if: steps.chk.outputs.existe != 'true'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Poner las novedades en la publicación
        if: steps.chk.outputs.existe != 'true'
        shell: bash
        run: |
          node tools/notas_version.js > notas.txt
          gh release edit "v${{ steps.chk.outputs.ver }}" --notes-file notas.txt --title "Ar_Trading v${{ steps.chk.outputs.ver }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
