name: Crear instalador y publicar
on:
  push:
    branches: [main]
    paths: ['package.json']   # solo cuando se sube una version nueva
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Preparar la version en GitHub
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          gh release delete "v$VER" --cleanup-tag -y || true
          gh release create "v$VER" --target "$GITHUB_SHA" --title "Ar_Trading $VER" --notes "Instalador de Ar_Trading $VER. Descarga el .exe, ejecutalo y listo."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
